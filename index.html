<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b91c1c">
<title>Tension</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { --red:#b91c1c; --bg:#f7f7f8; --card:#fff; --txt:#1f2937; --mut:#6b7280; --bd:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111214; --card:#1c1d21; --txt:#f3f4f6; --mut:#9ca3af; --bd:#2d2f35; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--txt); }
  main { max-width:520px; margin:0 auto; padding:16px; }
  header { display:flex; align-items:center; justify-content:space-between; margin:8px 0 16px; }
  h1 { font-size:1.4rem; margin:0; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:16px; margin-bottom:16px; }
  .row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  label { display:block; font-size:.8rem; color:var(--mut); margin-bottom:4px; }
  input { width:100%; padding:12px; font-size:1.3rem; border:1px solid var(--bd); border-radius:10px; background:var(--bg); color:var(--txt); }
  input[type=datetime-local], input[type=text], input[type=email], input[type=password] { font-size:1rem; }
  .full { margin-top:10px; }
  button { font:inherit; border:0; border-radius:10px; padding:12px 16px; cursor:pointer; }
  button:disabled { opacity:.5; }
  .primary { background:var(--red); color:#fff; width:100%; margin-top:14px; font-size:1.1rem; font-weight:600; }
  .ghost { background:transparent; border:1px solid var(--bd); color:var(--txt); }
  .small { padding:6px 10px; font-size:.85rem; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; text-align:center; }
  .stats b { display:block; font-size:1.3rem; }
  .stats span { font-size:.75rem; color:var(--mut); }
  ul { list-style:none; padding:0; margin:0; }
  li { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--bd); }
  li:last-child { border-bottom:0; }
  .val { font-size:1.15rem; font-weight:600; }
  .meta { font-size:.8rem; color:var(--mut); }
  .del { background:transparent; color:var(--mut); padding:6px 10px; }
  .empty { color:var(--mut); text-align:center; padding:12px 0; }
  .msg { font-size:.9rem; color:var(--mut); margin-top:10px; min-height:1.2em; }
  .link { background:none; color:var(--red); padding:0; margin-top:10px; font-size:.9rem; }
  [hidden] { display:none !important; }

  /* ---------- graphique ---------- */
  :root { --c-sys:#2a78d6; --c-dia:#eb6834; --c-pul:#1baf7a; --grid:#e8e7e3; --axis:#52514e; --ref:#8a8984; --surf:#fcfcfb; }
  @media (prefers-color-scheme: dark) {
    :root { --c-sys:#3987e5; --c-dia:#d95926; --c-pul:#199e70; --grid:#2d2d2b; --axis:#c3c2b7; --ref:#8a8984; --surf:#1a1a19; }
  }
  .chart-card { background:var(--surf); }
  .chart-head { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .chart-head h2 { font-size:1rem; margin:0; }
  .seg { display:flex; border:1px solid var(--bd); border-radius:10px; overflow:hidden; }
  .seg button { border-radius:0; padding:6px 10px; font-size:.8rem; background:transparent; color:var(--txt); }
  .seg button[aria-pressed=true] { background:var(--txt); color:var(--card); }
  .legend { display:flex; gap:14px; font-size:.8rem; color:var(--mut); margin:4px 0 2px; }
  .legend i { display:inline-block; width:14px; height:2px; vertical-align:middle; margin-right:6px; border-radius:1px; }
  .chart-wrap { position:relative; }
  .chart-wrap svg { display:block; width:100%; height:auto; overflow:visible; }
  .chart-sub { font-size:.8rem; color:var(--mut); margin:14px 0 0; }
  .tip { position:absolute; pointer-events:none; background:var(--card); border:1px solid var(--bd); border-radius:8px;
         padding:6px 9px; font-size:.8rem; box-shadow:0 2px 8px rgba(0,0,0,.12); white-space:nowrap; z-index:2; }
  .tip b { font-weight:600; }
  .tip .sw { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🩺 Tension artérielle</h1>
    <button class="ghost small" id="logout" hidden>Déconnexion</button>
  </header>

  <!-- Connexion -->
  <form class="card" id="auth" hidden>
    <div><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
    <div class="full"><label for="pwd">Mot de passe</label><input id="pwd" type="password" autocomplete="current-password" minlength="6" required></div>
    <button class="primary" type="submit" id="authBtn">Se connecter</button>
    <button class="link" type="button" id="toggleMode">Pas encore de compte ? Créer un compte</button>
    <div class="msg" id="authMsg"></div>
  </form>

  <!-- Appli -->
  <section id="app" hidden>
    <form class="card" id="form">
      <div class="row">
        <div><label for="sys">Systolique</label><input id="sys" type="number" inputmode="numeric" min="50" max="260" required placeholder="120"></div>
        <div><label for="dia">Diastolique</label><input id="dia" type="number" inputmode="numeric" min="30" max="160" required placeholder="80"></div>
        <div><label for="pul">Pouls</label><input id="pul" type="number" inputmode="numeric" min="30" max="220" placeholder="70"></div>
      </div>
      <div class="full"><label for="dt">Date et heure</label><input id="dt" type="datetime-local" required></div>
      <div class="full"><label for="note">Note (facultatif)</label><input id="note" type="text" placeholder="bras gauche, après café…"></div>
      <button class="primary" type="submit" id="saveBtn">Enregistrer</button>
      <div class="msg" id="formMsg"></div>
    </form>

    <div class="card"><div class="stats" id="stats"></div></div>

    <div class="card chart-card">
      <div class="chart-head">
        <h2>Tension (mmHg)</h2>
        <div class="seg" id="periode">
          <button data-j="7">7 j</button><button data-j="30" aria-pressed="true">30 j</button><button data-j="90">90 j</button><button data-j="0">Tout</button>
        </div>
      </div>
      <div class="legend"><span><i style="background:var(--c-sys)"></i>Systolique</span><span><i style="background:var(--c-dia)"></i>Diastolique</span><span><i style="background:repeating-linear-gradient(90deg,var(--ref) 0 4px,transparent 4px 7px)"></i>135/85</span></div>
      <div class="chart-wrap" id="chartBP"></div>
      <p class="chart-sub">Pouls (bpm)</p>
      <div class="chart-wrap" id="chartPul"></div>
    </div>

    <div class="card">
      <div class="tools" style="margin-bottom:10px">
        <button class="ghost" id="export">Exporter CSV</button>
        <button class="ghost" id="importBtn">Importer CSV</button>
        <input type="file" id="importFile" accept=".csv,text/csv" hidden>
      </div>
      <ul id="list"></ul>
    </div>
  </section>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { SUPABASE_URL, SUPABASE_KEY } from './config.js';

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const LOCAL_KEY = 'tension.mesures.v1';   // anciennes mesures stockées sur l'appareil (v1)
let mesures = [];
let signup = false;

// ---------- utilitaires ----------
const nowLocal = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const fmt = iso => new Date(iso).toLocaleString('fr-FR', { weekday:'short', day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toLocalInput = iso => { const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const key = m => new Date(m.mesure_le).getTime() + '|' + m.systolique + '|' + m.diastolique;

// ---------- authentification ----------
$('toggleMode').addEventListener('click', () => {
  signup = !signup;
  $('authBtn').textContent = signup ? 'Créer le compte' : 'Se connecter';
  $('toggleMode').textContent = signup ? 'Déjà un compte ? Se connecter' : 'Pas encore de compte ? Créer un compte';
  $('pwd').autocomplete = signup ? 'new-password' : 'current-password';
  $('authMsg').textContent = '';
});

$('auth').addEventListener('submit', async e => {
  e.preventDefault();
  $('authBtn').disabled = true; $('authMsg').textContent = '…';
  const creds = { email: $('email').value.trim(), password: $('pwd').value };
  const { data, error } = signup ? await sb.auth.signUp(creds) : await sb.auth.signInWithPassword(creds);
  $('authBtn').disabled = false;
  if (error) { $('authMsg').textContent = error.message; return; }
  if (signup && !data.session) $('authMsg').textContent = 'Compte créé : confirme ton email puis connecte-toi.';
});

$('logout').addEventListener('click', () => sb.auth.signOut());

sb.auth.onAuthStateChange((_evt, session) => {
  const logged = !!session;
  $('auth').hidden = logged; $('app').hidden = !logged; $('logout').hidden = !logged;
  if (logged) setTimeout(async () => { await migrerLocal(); await charger(); }, 0);
  else { mesures = []; }
});

// ---------- données ----------
async function charger() {
  const { data, error } = await sb.from('mesures').select('*').order('mesure_le', { ascending: false });
  if (error) { $('list').innerHTML = `<div class="empty">Erreur : ${esc(error.message)}</div>`; return; }
  mesures = data; render();
}

async function inserer(rows) {
  const { error } = await sb.from('mesures').insert(rows);
  if (error) throw error;
}

// Reprise des mesures de la v1 (stockées dans le navigateur)
async function migrerLocal() {
  let anciennes = [];
  try { anciennes = JSON.parse(localStorage.getItem(LOCAL_KEY)) || []; } catch {}
  if (!anciennes.length) return;
  if (!confirm(`${anciennes.length} mesure(s) enregistrée(s) sur cet appareil. Les envoyer dans la base ?`)) return;
  try {
    await inserer(anciennes.map(m => ({
      mesure_le: new Date(m.date).toISOString(),
      systolique: m.sys, diastolique: m.dia, pouls: m.pul ?? null, note: m.note || null
    })));
    localStorage.removeItem(LOCAL_KEY);
  } catch (err) { alert('Reprise impossible : ' + err.message); }
}

// ---------- affichage ----------
function render() {
  $('list').innerHTML = mesures.length ? mesures.map(m => `
    <li>
      <div>
        <div class="val">${m.systolique}/${m.diastolique}${m.pouls ? ` <span class="meta">♥ ${m.pouls}</span>` : ''}</div>
        <div class="meta">${fmt(m.mesure_le)}${m.note ? ' · ' + esc(m.note) : ''}</div>
      </div>
      <button class="del" data-id="${m.id}" aria-label="Supprimer">✕</button>
    </li>`).join('') : '<div class="empty">Aucune mesure pour l’instant</div>';

  const since = Date.now() - 7 * 864e5;
  const week = mesures.filter(m => new Date(m.mesure_le) >= since);
  const avg = k => { const v = week.map(m => m[k]).filter(Boolean); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : '–'; };
  $('stats').innerHTML = `
    <div><b>${avg('systolique')}/${avg('diastolique')}</b><span>Moyenne 7 j</span></div>
    <div><b>${avg('pouls')}</b><span>Pouls moyen 7 j</span></div>
    <div><b>${mesures.length}</b><span>Mesures</span></div>`;
  renderCharts();
}

// ---------- graphique (SVG, sans dépendance) ----------
let periodeJ = 30;
$('periode').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  periodeJ = +b.dataset.j;
  [...$('periode').children].forEach(x => x.setAttribute('aria-pressed', x === b));
  renderCharts();
});
let rsz; addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(renderCharts, 150); });

function renderCharts() {
  const since = periodeJ ? Date.now() - periodeJ * 864e5 : -Infinity;
  const pts = mesures.filter(m => new Date(m.mesure_le) >= since)
                     .map(m => ({ ...m, t: new Date(m.mesure_le).getTime() }))
                     .sort((a, b) => a.t - b.t);
  drawChart($('chartBP'), pts, {
    height: 210, unit: 'mmHg',
    series: [{ key:'systolique', label:'Sys', color:'var(--c-sys)' }, { key:'diastolique', label:'Dia', color:'var(--c-dia)' }],
    refs: [{ v:135, label:'135' }, { v:85, label:'85' }]
  });
  drawChart($('chartPul'), pts.filter(p => p.pouls), {
    height: 120, unit: 'bpm',
    series: [{ key:'pouls', label:'Pouls', color:'var(--c-pul)' }]
  });
}

function drawChart(el, pts, o) {
  const W = Math.max(280, el.clientWidth || 480), H = o.height;
  const m = { t: 10, r: 46, b: 22, l: 30 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  if (!pts.length) { el.innerHTML = `<div class="empty">Pas de mesure sur la période</div>`; return; }

  // échelles
  const vals = pts.flatMap(p => o.series.map(s => p[s.key])).concat((o.refs || []).map(r => r.v)).filter(v => v != null);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const step = (hi - lo) > 60 ? 20 : 10;
  lo = Math.floor((lo - 5) / step) * step; hi = Math.ceil((hi + 5) / step) * step;
  let t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  if (t1 - t0 < 864e5) { t0 -= 432e5; t1 += 432e5; }
  const x = t => m.l + (t - t0) / (t1 - t0) * iw;
  const y = v => m.t + (hi - v) / (hi - lo) * ih;

  let g = '';
  // grille + axe Y (récessifs)
  for (let v = lo; v <= hi; v += step) {
    g += `<line x1="${m.l}" x2="${m.l + iw}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--axis)">${v}</text>`;
  }
  // repères
  for (const r of o.refs || []) {
    g += `<line x1="${m.l}" x2="${m.l + iw}" y1="${y(r.v)}" y2="${y(r.v)}" stroke="var(--ref)" stroke-width="1" stroke-dasharray="4 4"/>`;
  }
  // axe X : 4 dates max
  const nT = Math.min(4, pts.length);
  for (let i = 0; i < nT; i++) {
    const t = t0 + (t1 - t0) * (nT === 1 ? .5 : i / (nT - 1));
    const anchor = nT === 1 ? 'middle' : i === 0 ? 'start' : i === nT - 1 ? 'end' : 'middle';
    g += `<text x="${x(t)}" y="${H - 4}" text-anchor="${anchor}" font-size="10" fill="var(--axis)">${new Date(t).toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit' })}</text>`;
  }
  // séries
  const showDots = pts.length <= 60;
  const labels = [];
  for (const s of o.series) {
    const sp = pts.filter(p => p[s.key] != null);
    if (!sp.length) continue;
    g += `<path d="${sp.map((p, i) => (i ? 'L' : 'M') + x(p.t).toFixed(1) + ',' + y(p[s.key]).toFixed(1)).join('')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (showDots) g += sp.map(p => `<circle cx="${x(p.t)}" cy="${y(p[s.key])}" r="4" fill="${s.color}" stroke="var(--surf)" stroke-width="2"/>`).join('');
    const last = sp[sp.length - 1];
    labels.push({ y: y(last[s.key]), txt: `${s.label} ${last[s.key]}` });
  }
  // étiquettes directes en bout de courbe (anti-chevauchement)
  labels.sort((a, b) => a.y - b.y);
  for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 13) labels[i].y = labels[i - 1].y + 13;
  g += labels.map(l => `<text x="${m.l + iw + 6}" y="${l.y + 4}" font-size="10.5" fill="var(--txt)">${l.txt}</text>`).join('');

  // couche de survol
  g += `<line class="xh" y1="${m.t}" y2="${m.t + ih}" stroke="var(--axis)" stroke-width="1" opacity="0"/>`;
  g += `<g class="hl"></g>`;
  g += `<rect x="${m.l}" y="0" width="${iw}" height="${H}" fill="transparent" style="touch-action:pan-y"/>`;

  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique ${o.unit}">${g}</svg><div class="tip" hidden></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = svg.querySelector('.xh'), hl = svg.querySelector('.hl');

  const move = ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) * W / r.width;
    let best = pts[0];
    for (const p of pts) if (Math.abs(x(p.t) - px) < Math.abs(x(best.t) - px)) best = p;
    const cx = x(best.t);
    xh.setAttribute('x1', cx); xh.setAttribute('x2', cx); xh.setAttribute('opacity', .5);
    hl.innerHTML = o.series.filter(s => best[s.key] != null)
      .map(s => `<circle cx="${cx}" cy="${y(best[s.key])}" r="5" fill="${s.color}" stroke="var(--surf)" stroke-width="2"/>`).join('');
    tip.innerHTML = `<div class="meta">${fmt(best.mesure_le)}</div>` +
      o.series.filter(s => best[s.key] != null)
        .map(s => `<div><span class="sw" style="background:${s.color}"></span>${s.label} <b>${best[s.key]}</b> ${o.unit}</div>`).join('');
    tip.hidden = false;
    const left = cx * r.width / W;
    tip.style.top = '0px';
    tip.style.left = Math.min(Math.max(0, left + 12), r.width - tip.offsetWidth) + 'px';
    if (left + 12 + tip.offsetWidth > r.width) tip.style.left = Math.max(0, left - tip.offsetWidth - 12) + 'px';
  };
  const out = () => { tip.hidden = true; xh.setAttribute('opacity', 0); hl.innerHTML = ''; };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', out);
}

// ---------- actions ----------
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  $('saveBtn').disabled = true; $('formMsg').textContent = '';
  try {
    await inserer([{
      mesure_le: new Date($('dt').value).toISOString(),
      systolique: +$('sys').value,
      diastolique: +$('dia').value,
      pouls: $('pul').value ? +$('pul').value : null,
      note: $('note').value.trim() || null
    }]);
    e.target.reset(); $('dt').value = nowLocal();
    await charger();
  } catch (err) { $('formMsg').textContent = 'Erreur : ' + err.message; }
  $('saveBtn').disabled = false;
});

$('list').addEventListener('click', async e => {
  const id = e.target.dataset.id;
  if (!id || !confirm('Supprimer cette mesure ?')) return;
  const { error } = await sb.from('mesures').delete().eq('id', id);
  if (error) alert(error.message); else await charger();
});

$('export').addEventListener('click', () => {
  const rows = [['date','systolique','diastolique','pouls','note']]
    .concat([...mesures].reverse().map(m => [toLocalInput(m.mesure_le), m.systolique, m.diastolique, m.pouls ?? '',
      '"' + (m.note || '').replace(/"/g, '""') + '"']));
  const blob = new Blob(['﻿' + rows.map(r => r.join(';')).join('\n')], { type:'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tension_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
});

$('importBtn').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const known = new Set(mesures.map(key));
  const rows = [];
  for (const l of (await f.text()).replace(/^﻿/, '').split(/\r?\n/).slice(1).filter(Boolean)) {
    const [date, sys, dia, pul, ...rest] = l.split(';');
    if (!date || !sys || !dia) continue;
    const m = { mesure_le: new Date(date).toISOString(), systolique: +sys, diastolique: +dia,
                pouls: pul ? +pul : null, note: rest.join(';').replace(/^"|"$/g, '').replace(/""/g, '"') || null };
    if (known.has(key(m))) continue;
    known.add(key(m)); rows.push(m);
  }
  e.target.value = '';
  if (!rows.length) { alert('Aucune nouvelle mesure à importer'); return; }
  try { await inserer(rows); await charger(); alert(rows.length + ' mesure(s) importée(s)'); }
  catch (err) { alert('Import impossible : ' + err.message); }
});

$('dt').value = nowLocal();
</script>
</body>
</html>
